<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FastSigns Eatontown</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#FF6B00;--orange-dim:rgba(255,107,0,0.1);
  --bg:#0A0A0B;--s1:#111113;--s2:#18181B;--s3:#222226;--s4:#2A2A2F;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --text:#EDEDF0;--muted:#8888A0;--dim:#444455;
  --red:#FF4444;--yellow:#FFB800;--green:#00D26A;
  --blue:#3B82F6;--purple:#A855F7;--teal:#06B6D4;--pink:#EC4899;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}

header{background:var(--s1);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100}
.logo{width:28px;height:28px;background:var(--orange);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff;flex-shrink:0}
.logo-title{font-size:13px;font-weight:700}
.logo-sub{font-size:11px;color:var(--muted);margin-top:1px}
.header-center{flex:1;display:flex;justify-content:center}
.nav-tabs{display:flex;gap:2px;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:3px}
.nav-tab{background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;padding:5px 14px;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{background:var(--s4);color:#fff}
.header-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.sync-dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
.sync-txt{font-size:11px;color:var(--muted)}
.refresh-btn{background:var(--s3);border:1px solid var(--border2);color:var(--muted);font-size:11px;font-weight:600;padding:5px 11px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;transition:all .15s}
.refresh-btn:hover{color:var(--text);border-color:var(--orange)}
.refresh-btn svg{transition:transform .3s}
.spinning svg{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.page{display:none;padding:20px}.page.active{display:block}

/* QUEUE TABS */
.queue-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto}
.qtab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:12px;font-weight:600;padding:10px 16px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:6px;margin-bottom:-1px}
.qtab:hover{color:var(--text)}
.qtab.active{color:#fff;border-bottom-color:var(--qc,var(--orange))}
.qtab .badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--s3)}
.qtab.active .badge{background:var(--qc,var(--orange));color:#fff}

/* JOB GRID */
.job-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.job-card{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:border-color .15s,transform .1s;position:relative;overflow:hidden}
.job-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.job-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--jc,var(--border2))}
.job-num{font-family:monospace;font-size:10px;color:var(--dim);margin-bottom:4px}
.job-co{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px;line-height:1.3}
.job-desc{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.4}
.job-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px}
.job-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.job-due{font-size:10px;color:var(--muted)}
.job-due.overdue{color:var(--red);font-weight:600}
.job-due.soon{color:var(--yellow)}
.job-amt{font-size:12px;font-weight:700;color:var(--orange)}
.job-rep{font-size:10px;color:var(--dim);margin-top:6px;display:flex;align-items:center;gap:5px}
.rep-av{width:16px;height:16px;border-radius:50%;background:var(--s4);display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:var(--muted);flex-shrink:0}
.empty{text-align:center;padding:40px;color:var(--dim);font-size:13px;grid-column:1/-1}

/* TABLE */
.tbl-wrap{background:var(--s1);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:16px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:10px 14px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border);background:var(--s2)}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:hover td{background:var(--s2);cursor:pointer}
tr:last-child td{border-bottom:none}
.mono{font-family:monospace;color:var(--muted)}

/* TOOLBAR */
.toolbar{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.search{background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:7px 12px;font-size:12px;color:var(--text);font-family:'Inter',sans-serif;width:220px}
.search::placeholder{color:var(--dim)}
.search:focus{outline:none;border-color:var(--orange)}
.rep-pill{background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.rep-pill:hover{border-color:var(--border2);color:var(--text)}
.rep-pill.on{background:var(--orange-dim);border-color:var(--orange);color:var(--orange)}
.count-lbl{margin-left:auto;font-size:11px;color:var(--dim)}

/* STAT STRIP */
.stat-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:14px;position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--sc,var(--orange))}
.stat-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.stat-val{font-size:24px;font-weight:800;color:#fff}
.stat-sub{font-size:11px;color:var(--muted);margin-top:3px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.overlay.open{display:flex}
.modal{background:var(--s1);border:1px solid var(--border2);border-radius:12px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto}
.modal-top{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start}
.modal-num{font-family:monospace;font-size:11px;color:var(--orange);margin-bottom:3px;font-weight:600}
.modal-co{font-size:17px;font-weight:800}
.modal-x{margin-left:auto;background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;line-height:1;padding:2px}
.modal-x:hover{color:var(--text)}
.modal-body{padding:18px 22px}
.m2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.mf label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:3px}
.mf .v{font-size:13px;color:var(--text)}
.mdiv{border:none;border-top:1px solid var(--border);margin:14px 0}
.modal-acts{display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--border)}
.abtn{flex:1;padding:9px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border2);background:var(--s2);color:var(--muted);font-family:'Inter',sans-serif;transition:all .15s}
.abtn:hover{color:var(--text);border-color:var(--orange)}
.abtn.primary{background:var(--orange);border-color:var(--orange);color:#fff}

/* LOADER */
.loader{position:fixed;inset:0;background:rgba(10,10,11,.9);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(4px)}
.loader.open{display:flex}
.ring{width:32px;height:32px;border:3px solid var(--s3);border-top-color:var(--orange);border-radius:50%;animation:spin .6s linear infinite}
.load-txt{font-size:13px;color:var(--muted)}

/* REPORTS */
.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.report-card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:20px}
.rc-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.rc-big{font-size:30px;font-weight:900;color:#fff;line-height:1}
.rc-sub{font-size:12px;color:var(--muted);margin-top:4px;margin-bottom:14px}
.rc-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.rc-row:last-child{border-bottom:none}

@media(max-width:700px){.stat-strip{grid-template-columns:repeat(3,1fr)}.nav-tab{padding:5px 8px;font-size:10px}}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="ring"></div>
  <div class="load-txt" id="load-txt">Connecting to Corebridge...</div>
</div>

<header>
  <div class="logo">FS</div>
  <div><div class="logo-title">FastSigns Eatontown</div><div class="logo-sub">Operations Hub</div></div>
  <div class="header-center">
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showPage('queues',this)">Queues</button>
      <button class="nav-tab" onclick="showPage('orders',this)">Orders</button>
      <button class="nav-tab" onclick="showPage('estimates',this)">Estimates</button>
      <button class="nav-tab" onclick="showPage('reports',this)">Reports</button>
    </div>
  </div>
  <div class="header-right">
    <div class="sync-dot" id="sync-dot"></div>
    <span class="sync-txt" id="sync-txt">Loading...</span>
    <button class="refresh-btn" id="refresh-btn" onclick="loadAll()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Refresh
    </button>
  </div>
</header>

<!-- QUEUES PAGE -->
<div class="page active" id="page-queues">
  <div class="stat-strip" id="stat-strip"></div>
  <div class="queue-tabs" id="queue-tabs"></div>
  <div class="toolbar">
    <input class="search" placeholder="Search customer, order #, product..." oninput="setSearch(this.value)" id="q-search"/>
    <div id="rep-btns"></div>
    <span class="count-lbl" id="q-count"></span>
  </div>
  <div class="job-grid" id="job-grid"></div>
</div>

<!-- ORDERS PAGE -->
<div class="page" id="page-orders">
  <div class="toolbar">
    <input class="search" placeholder="Search orders..." oninput="filterTbl('orders-body',this.value)"/>
  </div>
  <div class="tbl-wrap">
    <table><thead><tr><th>Order #</th><th>Customer</th><th>Description</th><th>Status</th><th>Due</th><th>Amount</th><th>Rep</th></tr></thead>
    <tbody id="orders-body"></tbody></table>
  </div>
</div>

<!-- ESTIMATES PAGE -->
<div class="page" id="page-estimates">
  <div class="toolbar">
    <input class="search" placeholder="Search estimates..." oninput="filterTbl('estimates-body',this.value)"/>
  </div>
  <div class="tbl-wrap">
    <table><thead><tr><th>Est #</th><th>Customer</th><th>Description</th><th>Status</th><th>Due</th><th>Amount</th><th>Rep</th></tr></thead>
    <tbody id="estimates-body"></tbody></table>
  </div>
</div>

<!-- REPORTS PAGE -->
<div class="page" id="page-reports">
  <div class="report-grid" id="report-grid"></div>
</div>

<!-- MODAL -->
<div class="overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-top">
      <div><div class="modal-num" id="m-num"></div><div class="modal-co" id="m-co"></div></div>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="m2">
        <div class="mf"><label>Description</label><div class="v" id="m-desc"></div></div>
        <div class="mf"><label>Amount</label><div class="v" id="m-amt"></div></div>
      </div>
      <div class="m2">
        <div class="mf"><label>Status</label><div class="v" id="m-status"></div></div>
        <div class="mf"><label>Rep</label><div class="v" id="m-rep"></div></div>
      </div>
      <div class="m2">
        <div class="mf"><label>Due Date</label><div class="v" id="m-due"></div></div>
        <div class="mf"><label>Contact</label><div class="v" id="m-contact"></div></div>
      </div>
      <hr class="mdiv">
      <div class="m2">
        <div class="mf"><label>Email</label><div class="v" id="m-email"></div></div>
        <div class="mf"><label>Production</label><div class="v" id="m-type"></div></div>
      </div>
    </div>
    <div class="modal-acts">
      <button class="abtn" onclick="copyNum()">📋 Copy #</button>
      <button class="abtn" onclick="findInstaller()">🔧 Find Installer</button>
      <button class="abtn primary" onclick="findVendor()">🏭 Find Vendor</button>
    </div>
  </div>
</div>

<script>
const PROXY = '/api/corebridge';
let allOrders = [], allEstimates = [];
let activeQueue = 'all', searchQ = '', activeRep = 'all';
let currentItem = null;

// ── QUEUE DEFINITIONS based on exact Corebridge status values ──
const QUEUES = [
  { id:'all',        name:'All Active',       color:'var(--orange)', filter: j => true },
  { id:'sales',      name:'Sales Review',     color:'var(--pink)',   filter: j => j.cbStatus.includes('sales review') || j.cbStatus.includes('order review') || j.cbStatus === 'estimate : estimate' || j.cbStatus.includes('design needed') },
  { id:'customer',   name:'Customer Action',  color:'var(--yellow)', filter: j => j.cbStatus.includes('awaiting customer') || j.cbStatus.includes('customer action') || j.cbStatus.includes('follow') || j.cbStatus.includes('awaiting proof') || j.cbStatus.includes('proof approved') },
  { id:'design',     name:'In Design',        color:'var(--teal)',   filter: j => (j.cbStatus.includes('in design') && !j.cbStatus.includes('revision')) || j.cbStatus.includes('design review') || j.cbStatus.includes('quality control') },
  { id:'revision',   name:'Design Revision',  color:'var(--orange)', filter: j => j.cbStatus.includes('revision') },
  { id:'production', name:'In Production',    color:'var(--blue)',   filter: j => j.cbStatus.includes('in production') || (j.cbStatus.includes('wip') && !j.cbStatus.includes('design') && !j.cbStatus.includes('vend') && !j.cbStatus.includes('review') && !j.cbStatus.includes('customer') && !j.cbStatus.includes('proof') && !j.cbStatus.includes('built')) },
  { id:'vended',     name:'Vended',           color:'var(--purple)', filter: j => j.isVended || j.cbStatus.includes('vend') },
  { id:'built',      name:'Built / Ready',    color:'var(--green)',  filter: j => j.cbStatus.includes('built') || j.cbStatus.includes('awaiting installation') || j.cbStatus.includes('awaiting pickup') },
  { id:'overdue',    name:'Overdue',          color:'var(--red)',    filter: j => j.isOverdue },
];

// ── HELPERS ──
function parseDate(raw) {
  if (!raw) return null;
  if (typeof raw === 'object' && raw.DateText) raw = raw.DateText;
  if (!raw) return null;
  const d = new Date(raw);
  return isNaN(d.getTime()) ? null : d;
}

function fmtDate(d) {
  if (!d) return '—';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function fmtAmt(n) {
  if (!n || n === 0) return '';
  return '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function initials(name) {
  return (name||'?').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
}

function dueLbl(d, isBuilt) {
  if (!d) return {txt:'No date',cls:''};
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.floor((d-today)/86400000);
  if (diff < 0 && !isBuilt) return {txt:`${Math.abs(diff)}d overdue`,cls:'overdue'};
  if (diff === 0) return {txt:'Due today',cls:'soon'};
  if (diff <= 3) return {txt:`Due in ${diff}d`,cls:'soon'};
  return {txt:fmtDate(d),cls:''};
}

// ── MAP RECORD ──
function mapRecord(item, type) {
  const statusRaw = item.Status || '';
  const cbStatus = statusRaw.toLowerCase();
  const dueDate = parseDate(item.EstimateProjectedOrderDueDate) ||
                  parseDate(item.OrderDueDate) ||
                  parseDate(item.DueDate);
  const today = new Date(); today.setHours(0,0,0,0);
  const isBuilt = cbStatus.includes('built');
  const isOverdue = dueDate && dueDate < today && !isBuilt;

  return {
    id: String(item.OrderId || item.EstimateId || item.Id || ''),
    num: type === 'estimate'
      ? (item.EstimateNumber ? `EST-${item.EstimateNumber}` : String(item.OrderId||''))
      : String(item.OrderId||''),
    customer: item.CompanyName || item.CustomerName || item.OrderContact || '—',
    contact: item.OrderContact || item.EstimateContact || '',
    email: item.OrderContactEmail || item.EstimateContactEmail || '',
    phone: item.CompanyPhone || '',
    description: item.OrderDescription || item.OrderText || item.EstimateText || '—',
    status: statusRaw,
    cbStatus: cbStatus,
    rep: item.OrderSalesPerson || item.OrderSalesPerson || item.SalespersonName || '—',
    dueDate,
    amount: parseFloat(item.OrderSubTotal||item.OrderTotal||item.SubtotalAmount||0),
    isVended: cbStatus.includes('vend'),
    isBuilt,
    isOverdue,
    type,
  };
}

// ── FETCH ──
async function apiFetch(endpoint, action, extraParams) {
  let url = `${PROXY}?endpoint=${endpoint}`;
  if (action) url += `&action=${action}`;
  if (extraParams) url += `&${extraParams}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${endpoint}${action?'/'+action:''}: HTTP ${r.status}`);
  const d = await r.json();
  if (d && d.error) throw new Error(d.error);
  return Array.isArray(d) ? d : [];
}

// ── LOAD ALL ──
async function loadAll() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  showLoader('Connecting to Corebridge...');

  allOrders = [];
  allEstimates = [];

  try {
    // Pull WIP + BUILT orders
    for (const status of ['WIP','BUILT']) {
      try {
        const items = await apiFetch('ExOrder','GetOrdersByStatus',`listOfStatus=${status}`);
        console.log(`${status}:`, items.length);
        allOrders = allOrders.concat(items.map(i => mapRecord(i, 'order')));
      } catch(e) { console.warn(status, e.message); }
    }

    // Pull ESTIMATE orders — these are shown in both Queues (Customer Action, Sales Review)
    // and the Estimates tab
    try {
      const estItems = await apiFetch('ExOrder','GetOrdersByStatus','listOfStatus=ESTIMATE');
      console.log('ESTIMATE:', estItems.length);
      allEstimates = estItems.map(i => mapRecord(i, 'estimate'));
    } catch(e) { console.warn('ESTIMATE', e.message); }

    // Dedupe by ID
    const seenO = new Set();
    allOrders = allOrders.filter(j => { if (seenO.has(j.id)) return false; seenO.add(j.id); return true; });

    console.log('Orders:', allOrders.length, '| Estimates:', allEstimates.length);

    renderAll();
    buildRepFilters();

    const now = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('sync-dot').className = 'sync-dot live';
    document.getElementById('sync-txt').textContent = `Live · ${now}`;

  } catch(err) {
    console.error('Load failed:', err);
    document.getElementById('sync-txt').textContent = 'Error: ' + err.message;
  } finally {
    hideLoader();
    btn.classList.remove('spinning');
  }
}

// ── RENDER ALL ──
function renderAll() {
  renderStats();
  renderQueueTabs();
  renderQueueGrid();
  renderOrdersTable();
  renderEstimatesTable();
  renderReports();
}

// ── STATS ──
function renderStats() {
  const allItems = [...allOrders, ...allEstimates];
  const wipCount = allOrders.filter(j=>j.cbStatus.includes('wip')||j.cbStatus.includes('in production')).length;
  const overdueCount = allItems.filter(j=>j.isOverdue).length;
  const vendedCount = allItems.filter(j=>j.isVended).length;
  const builtCount = allOrders.filter(j=>j.isBuilt).length;
  const totalVal = allOrders.reduce((s,j)=>s+j.amount,0);

  document.getElementById('stat-strip').innerHTML = `
    <div class="stat" style="--sc:var(--orange)">
      <div class="stat-lbl">Total Active</div>
      <div class="stat-val">${allOrders.length}</div>
      <div class="stat-sub">Open orders</div>
    </div>
    <div class="stat" style="--sc:var(--yellow)">
      <div class="stat-lbl">Estimates</div>
      <div class="stat-val">${allEstimates.length}</div>
      <div class="stat-sub">In pipeline</div>
    </div>
    <div class="stat" style="--sc:var(--blue)">
      <div class="stat-lbl">In Production</div>
      <div class="stat-val">${wipCount}</div>
      <div class="stat-sub">WIP jobs</div>
    </div>
    <div class="stat" style="--sc:var(--purple)">
      <div class="stat-lbl">Vended</div>
      <div class="stat-val">${vendedCount}</div>
      <div class="stat-sub">Outsourced</div>
    </div>
    <div class="stat" style="--sc:var(--green)">
      <div class="stat-lbl">Built / Ready</div>
      <div class="stat-val">${builtCount}</div>
      <div class="stat-sub">Awaiting pickup/install</div>
    </div>
    <div class="stat" style="--sc:var(--red)">
      <div class="stat-lbl">Overdue</div>
      <div class="stat-val">${overdueCount}</div>
      <div class="stat-sub">Past due date</div>
    </div>`;
}

// ── QUEUE TABS ──
function renderQueueTabs() {
  const allItems = [...allOrders, ...allEstimates];
  document.getElementById('queue-tabs').innerHTML = QUEUES.map(q => {
    const count = q.id === 'all' ? allItems.length : allItems.filter(q.filter).length;
    return `<button class="qtab ${q.id===activeQueue?'active':''}" style="--qc:${q.color}" onclick="setQueue('${q.id}')">
      ${q.name} <span class="badge">${count}</span>
    </button>`;
  }).join('');
}

// ── QUEUE GRID ──
function renderQueueGrid() {
  const q = QUEUES.find(q=>q.id===activeQueue);
  let items = [...allOrders, ...allEstimates].filter(q.filter);

  if (searchQ) {
    const s = searchQ.toLowerCase();
    items = items.filter(j => j.customer.toLowerCase().includes(s) || j.num.toLowerCase().includes(s) || j.description.toLowerCase().includes(s));
  }
  if (activeRep !== 'all') {
    items = items.filter(j => j.rep === activeRep);
  }

  document.getElementById('q-count').textContent = `${items.length} item${items.length!==1?'s':''}`;

  if (items.length === 0) {
    document.getElementById('job-grid').innerHTML = `<div class="empty">No items in this queue</div>`;
    return;
  }

  const color = q.color;
  document.getElementById('job-grid').innerHTML = items.map(j => {
    const due = dueLbl(j.dueDate, j.isBuilt);
    const amt = fmtAmt(j.amount);
    const typTag = j.isVended
      ? `<span class="tag" style="background:rgba(168,85,247,.15);color:#C084FC">Outsourced</span>`
      : `<span class="tag" style="background:rgba(59,130,246,.15);color:#60A5FA">In-House</span>`;
    const estTag = j.type === 'estimate'
      ? `<span class="tag" style="background:rgba(255,184,0,.15);color:#FFB800">Estimate</span>` : '';
    const overdueTag = j.isOverdue
      ? `<span class="tag" style="background:rgba(255,68,68,.15);color:#FF6B6B">Overdue</span>` : '';

    return `<div class="job-card" style="--jc:${color}" onclick="openModal('${j.id}','${j.type}')">
      <div class="job-num">${j.num}</div>
      <div class="job-co">${j.customer}</div>
      <div class="job-desc">${j.description}</div>
      <div class="job-tags">${typTag}${estTag}${overdueTag}</div>
      <div class="job-foot">
        <span class="job-due ${due.cls}">${due.txt}</span>
        ${amt?`<span class="job-amt">${amt}</span>`:''}
      </div>
      <div class="job-rep"><div class="rep-av">${initials(j.rep)}</div>${j.rep}</div>
    </div>`;
  }).join('');
}

// ── TABLES ──
function renderOrdersTable() {
  document.getElementById('orders-body').innerHTML = allOrders.length === 0
    ? `<tr><td colspan="7" style="text-align:center;color:var(--dim);padding:30px">No orders</td></tr>`
    : allOrders.map(j=>`<tr onclick="openModal('${j.id}','order')">
        <td class="mono">${j.num}</td>
        <td><strong>${j.customer}</strong></td>
        <td style="color:var(--muted)">${j.description}</td>
        <td style="font-size:11px">${j.status}</td>
        <td class="mono" style="color:var(--muted)">${fmtDate(j.dueDate)}</td>
        <td style="color:var(--orange);font-weight:700">${fmtAmt(j.amount)}</td>
        <td style="color:var(--muted)">${j.rep}</td>
      </tr>`).join('');
}

function renderEstimatesTable() {
  document.getElementById('estimates-body').innerHTML = allEstimates.length === 0
    ? `<tr><td colspan="7" style="text-align:center;color:var(--dim);padding:30px">No estimates loaded</td></tr>`
    : allEstimates.map(j=>`<tr onclick="openModal('${j.id}','estimate')">
        <td class="mono">${j.num}</td>
        <td><strong>${j.customer}</strong></td>
        <td style="color:var(--muted)">${j.description}</td>
        <td style="font-size:11px">${j.status}</td>
        <td class="mono" style="color:var(--muted)">${fmtDate(j.dueDate)}</td>
        <td style="color:var(--orange);font-weight:700">${fmtAmt(j.amount)}</td>
        <td style="color:var(--muted)">${j.rep}</td>
      </tr>`).join('');
}

function filterTbl(tbodyId, q) {
  document.querySelectorAll(`#${tbodyId} tr`).forEach(r=>{
    r.style.display = r.textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}

// ── REPORTS ──
function renderReports() {
  const allItems = [...allOrders, ...allEstimates];
  const totalWIP = allOrders.reduce((s,j)=>s+j.amount,0);
  const byRep = {};
  allOrders.forEach(j=>{ if(!byRep[j.rep]) byRep[j.rep]={count:0,amt:0}; byRep[j.rep].count++; byRep[j.rep].amt+=j.amount; });
  const overdue = allItems.filter(j=>j.isOverdue);

  document.getElementById('report-grid').innerHTML = `
    <div class="report-card">
      <div class="rc-title">WIP Summary</div>
      <div class="rc-big">${fmtAmt(totalWIP)}</div>
      <div class="rc-sub">Total active order value</div>
      ${QUEUES.filter(q=>q.id!=='all'&&q.id!=='overdue').map(q=>{
        const cnt = allOrders.filter(q.filter).length;
        return cnt>0?`<div class="rc-row"><span style="color:var(--muted)">${q.name}</span><span style="font-weight:700">${cnt}</span></div>`:'';
      }).join('')}
    </div>
    <div class="report-card">
      <div class="rc-title">By Sales Rep</div>
      ${Object.entries(byRep).sort((a,b)=>b[1].amt-a[1].amt).map(([rep,d])=>`
        <div class="rc-row">
          <span style="font-weight:600">${rep}</span>
          <div style="text-align:right">
            <div style="color:var(--orange);font-weight:700">${fmtAmt(d.amt)}</div>
            <div style="font-size:10px;color:var(--dim)">${d.count} order${d.count!==1?'s':''}</div>
          </div>
        </div>`).join('')}
    </div>
    <div class="report-card">
      <div class="rc-title">Pipeline</div>
      <div class="rc-big">${allEstimates.length}</div>
      <div class="rc-sub">Open estimates</div>
      <div class="rc-big" style="color:var(--red);margin-top:16px">${overdue.length}</div>
      <div class="rc-sub">Overdue items</div>
    </div>`;
}

// ── MODAL ──
function openModal(id, type) {
  const all = [...allOrders, ...allEstimates];
  currentItem = all.find(j=>j.id===id&&j.type===type) || all.find(j=>j.id===id);
  if (!currentItem) return;
  const j = currentItem;
  document.getElementById('m-num').textContent = j.num;
  document.getElementById('m-co').textContent = j.customer;
  document.getElementById('m-desc').textContent = j.description;
  document.getElementById('m-amt').textContent = fmtAmt(j.amount)||'—';
  document.getElementById('m-status').textContent = j.status||'—';
  document.getElementById('m-rep').textContent = j.rep||'—';
  document.getElementById('m-due').textContent = fmtDate(j.dueDate);
  document.getElementById('m-contact').textContent = j.contact||'—';
  document.getElementById('m-email').textContent = j.email||'—';
  document.getElementById('m-type').textContent = j.isVended?'🏭 Outsourced':'🏠 In-House';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); currentItem=null; }
function copyNum(){ if(currentItem) navigator.clipboard.writeText(currentItem.num).then(()=>alert('Copied: '+currentItem.num)); }
function findInstaller(){ window.open('https://www.google.com/search?q=sign+installer+near+Eatontown+NJ','_blank'); }
function findVendor(){ if(currentItem) window.open(`https://www.google.com/search?q=${encodeURIComponent(currentItem.description+' sign wholesale vendor')},'_blank`); }

// ── FILTERS ──
function setQueue(id) {
  activeQueue = id;
  renderQueueTabs();
  renderQueueGrid();
}
function setSearch(q){ searchQ=q; renderQueueGrid(); }
function buildRepFilters(){
  const reps=[...new Set(allOrders.map(j=>j.rep).filter(Boolean))].sort();
  if(reps.length<2) return;
  document.getElementById('rep-btns').innerHTML =
    `<button class="rep-pill on" onclick="setRep('all',this)">All Reps</button>` +
    reps.map(r=>`<button class="rep-pill" onclick="setRep('${r}',this)" style="margin-left:4px">${r.split(' ')[0]}</button>`).join('');
}
function setRep(rep,btn){
  activeRep=rep;
  document.querySelectorAll('.rep-pill').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderQueueGrid();
}

// ── PAGE NAV ──
function showPage(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  btn.classList.add('active');
}

// ── LOADER ──
function showLoader(t){ document.getElementById('loader').classList.add('open'); document.getElementById('load-txt').textContent=t; }
function hideLoader(){ document.getElementById('loader').classList.remove('open'); }

window.addEventListener('DOMContentLoaded', loadAll);
</script>
</body>
</html>
