<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FastSigns Eatontown — Operations Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#FF6B00;--orange-dim:rgba(255,107,0,0.1);
  --bg:#0A0A0B;--s1:#111113;--s2:#18181B;--s3:#222226;--s4:#2A2A2F;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --text:#EDEDF0;--muted:#8888A0;--dim:#444455;
  --red:#FF4444;--yellow:#FFB800;--green:#00D26A;
  --blue:#3B82F6;--purple:#A855F7;--teal:#06B6D4;--pink:#EC4899;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}

/* HEADER */
header{background:var(--s1);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100}
.logo{width:28px;height:28px;background:var(--orange);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff;flex-shrink:0}
.logo-title{font-size:13px;font-weight:700}
.logo-sub{font-size:11px;color:var(--muted);margin-top:1px}
.hcenter{flex:1;display:flex;justify-content:center}
.nav-tabs{display:flex;gap:2px;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:3px}
.nav-tab{background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;padding:5px 14px;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{background:var(--s4);color:#fff}
.hright{display:flex;align-items:center;gap:8px;margin-left:auto}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex-shrink:0}
.sync-dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
.sync-txt{font-size:11px;color:var(--muted)}
.rbtn{background:var(--s3);border:1px solid var(--border2);color:var(--muted);font-size:11px;font-weight:600;padding:5px 11px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;transition:all .15s}
.rbtn:hover{color:var(--text);border-color:var(--orange)}
.rbtn.spinning svg{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* PAGES */
.page{display:none;padding:20px;max-width:1400px;margin:0 auto}.page.active{display:block}

/* STAT STRIP */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:14px;position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--sc,var(--orange))}
.stat-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.stat-val{font-size:24px;font-weight:800;color:#fff}
.stat-sub{font-size:11px;color:var(--muted);margin-top:3px}

/* QUEUE TABS */
.qtabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.qtab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:12px;font-weight:600;padding:9px 14px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:6px;margin-bottom:-1px}
.qtab:hover{color:var(--text)}
.qtab.active{color:#fff;border-bottom-color:var(--qc,var(--orange))}
.qbadge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--s3);color:var(--muted)}
.qtab.active .qbadge{background:var(--qc,var(--orange));color:#fff}

/* TOOLBAR */
.toolbar{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.search{background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:7px 12px;font-size:12px;color:var(--text);font-family:'Inter',sans-serif;width:240px}
.search::placeholder{color:var(--dim)}
.search:focus{outline:none;border-color:var(--orange)}
.pill{background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.pill:hover{border-color:var(--border2);color:var(--text)}
.pill.on{background:var(--orange-dim);border-color:var(--orange);color:var(--orange)}
.ml{margin-left:auto}
.count{font-size:11px;color:var(--dim)}

/* JOB GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:13px;cursor:pointer;transition:border-color .15s,transform .1s;position:relative;overflow:hidden}
.card:hover{border-color:var(--border2);transform:translateY(-1px)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cc,var(--border2))}
.card-num{font-family:monospace;font-size:10px;color:var(--dim);margin-bottom:4px}
.card-co{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px;line-height:1.3}
.card-desc{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.card-due{font-size:10px;color:var(--muted)}
.card-due.overdue{color:var(--red);font-weight:600}
.card-due.soon{color:var(--yellow)}
.card-amt{font-size:12px;font-weight:700;color:var(--orange)}
.card-rep{font-size:10px;color:var(--dim);margin-top:6px;display:flex;align-items:center;gap:5px}
.av{width:16px;height:16px;border-radius:50%;background:var(--s4);display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:var(--muted);flex-shrink:0}
.card-created{font-size:10px;color:var(--dim);margin-top:4px}
.empty{text-align:center;padding:40px;color:var(--dim);font-size:13px;grid-column:1/-1;border:1px dashed var(--border);border-radius:8px}

/* SUB TABS */
.subtabs{display:flex;gap:4px;margin-bottom:16px}
.stab{background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.stab:hover{color:var(--text)}
.stab.active{background:var(--orange-dim);border-color:var(--orange);color:var(--orange)}

/* TABLE */
.tbl-wrap{background:var(--s1);border:1px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:10px 14px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border);background:var(--s2);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
.tbl-wrap tbody tr:hover td{background:var(--s2);cursor:pointer}
.mono{font-family:monospace;color:var(--muted);font-size:11px}

/* ESTIMATE BUCKETS */
.bucket-section{margin-bottom:28px}
.bucket-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.bucket-title{font-size:13px;font-weight:700;color:#fff}
.bucket-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--s3);color:var(--muted)}
.bucket-val{font-size:11px;color:var(--orange);font-weight:600;margin-left:auto}

/* EST SUMMARY CARDS */
.est-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.est-stat{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.est-stat-val{font-size:22px;font-weight:800;color:#fff;margin-bottom:3px}
.est-stat-lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.est-stat-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* CUSTOMER PAGE */
.cust-layout{display:grid;grid-template-columns:320px 1fr;gap:16px;min-height:500px}
.cust-list{background:var(--s2);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.cust-search-wrap{padding:12px;border-bottom:1px solid var(--border)}
.cust-items{overflow-y:auto;flex:1;max-height:calc(100vh - 200px)}
.cust-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.cust-item:hover{background:var(--s3)}
.cust-item.active{background:var(--orange-dim);border-left:2px solid var(--orange)}
.cust-item:last-child{border-bottom:none}
.cust-name{font-size:13px;font-weight:600;color:#fff;margin-bottom:2px}
.cust-meta{font-size:11px;color:var(--muted)}
.cust-detail{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:20px;overflow-y:auto}
.cust-detail-header{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.cust-detail-name{font-size:20px;font-weight:800;color:#fff;margin-bottom:6px}
.cust-detail-meta{display:flex;gap:16px;flex-wrap:wrap}
.cust-meta-item{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.cust-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.cust-stat{background:var(--s3);border-radius:6px;padding:12px;text-align:center}
.cust-stat-val{font-size:18px;font-weight:800;color:#fff}
.cust-stat-lbl{font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-top:2px}
.section-title{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.cust-jobs-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.cust-job-row{background:var(--s3);border-radius:6px;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .15s}
.cust-job-row:hover{background:var(--s4)}
.cust-job-num{font-family:monospace;font-size:11px;color:var(--muted);width:70px;flex-shrink:0}
.cust-job-desc{font-size:12px;color:var(--text);flex:1}
.cust-job-status{font-size:10px;color:var(--muted)}
.cust-job-amt{font-size:12px;font-weight:700;color:var(--orange);flex-shrink:0}
.no-selection{display:flex;align-items:center;justify-content:center;height:100%;color:var(--dim);font-size:13px}

/* REPORTS */
.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.rc{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:20px}
.rc-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.rc-big{font-size:28px;font-weight:900;color:#fff;line-height:1}
.rc-sub{font-size:12px;color:var(--muted);margin-top:4px;margin-bottom:14px}
.rc-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.rc-row:last-child{border-bottom:none}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.overlay.open{display:flex}
.modal{background:var(--s1);border:1px solid var(--border2);border-radius:12px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto}
.modal-top{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start}
.modal-num{font-family:monospace;font-size:11px;color:var(--orange);margin-bottom:3px;font-weight:600}
.modal-co{font-size:17px;font-weight:800}
.modal-x{margin-left:auto;background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;line-height:1}
.modal-x:hover{color:var(--text)}
.modal-body{padding:18px 22px}
.m2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.mf label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:3px}
.mf .v{font-size:13px;color:var(--text)}
.mdiv{border:none;border-top:1px solid var(--border);margin:14px 0}
.modal-acts{display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--border)}
.abtn{flex:1;padding:9px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border2);background:var(--s2);color:var(--muted);font-family:'Inter',sans-serif;transition:all .15s}
.abtn:hover{color:var(--text);border-color:var(--orange)}
.abtn.primary{background:var(--orange);border-color:var(--orange);color:#fff}

/* LOADER */
.loader{position:fixed;inset:0;background:rgba(10,10,11,.9);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(4px)}
.loader.open{display:flex}
.ring{width:32px;height:32px;border:3px solid var(--s3);border-top-color:var(--orange);border-radius:50%;animation:spin .6s linear infinite}
.load-txt{font-size:13px;color:var(--muted)}

@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.cust-layout{grid-template-columns:1fr}.cust-items{max-height:200px}.est-summary{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.nav-tab{padding:5px 8px;font-size:10px}}
</style>
</head>
<body>

<div class="loader" id="loader"><div class="ring"></div><div class="load-txt" id="load-txt">Connecting to Corebridge...</div></div>

<header>
  <div class="logo">FS</div>
  <div><div class="logo-title">FastSigns Eatontown</div><div class="logo-sub">Operations Hub</div></div>
  <div class="hcenter">
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showPage('queues',this)">Queues</button>
      <button class="nav-tab" onclick="showPage('orders',this)">Orders</button>
      <button class="nav-tab" onclick="showPage('estimates',this)">Estimates</button>
      <button class="nav-tab" onclick="showPage('customers',this)">Customers</button>
      <button class="nav-tab" onclick="showPage('reports',this)">Reports</button>
    </div>
  </div>
  <div class="hright">
    <div class="sync-dot" id="sync-dot"></div>
    <span class="sync-txt" id="sync-txt">Loading...</span>
    <button class="rbtn" id="refresh-btn" onclick="loadAll()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Refresh
    </button>
  </div>
</header>

<!-- QUEUES -->
<div class="page active" id="page-queues">
  <div class="stats" id="q-stats"></div>
  <div class="qtabs" id="q-tabs"></div>
  <div class="toolbar">
    <input class="search" placeholder="Search customer, order #, product..." oninput="setSearch(this.value)"/>
    <div id="rep-btns" style="display:flex;gap:4px;flex-wrap:wrap"></div>
    <span class="ml count" id="q-count"></span>
  </div>
  <div class="grid" id="q-grid"></div>
</div>

<!-- ORDERS -->
<div class="page" id="page-orders">
  <div class="subtabs">
    <button class="stab active" onclick="setOrderTab('active',this)">Active Jobs</button>
    <button class="stab" onclick="setOrderTab('completed',this)">Completed Jobs</button>
  </div>
  <div class="toolbar">
    <input class="search" placeholder="Search orders..." oninput="filterOrders(this.value)"/>
    <span class="ml count" id="o-count"></span>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr><th>Order #</th><th>Customer</th><th>Description</th><th>Status</th><th>Due Date</th><th>Amount</th><th>Rep</th></tr></thead>
      <tbody id="orders-body"></tbody>
    </table>
  </div>
</div>

<!-- ESTIMATES -->
<div class="page" id="page-estimates">
  <div class="est-summary" id="est-summary"></div>
  <div class="toolbar">
    <input class="search" placeholder="Search estimates..." oninput="filterEstimates(this.value)" id="est-search"/>
    <button class="pill on" onclick="setEstFilter('all',this)">All</button>
    <button class="pill" onclick="setEstFilter('open',this)">Open</button>
    <button class="pill" onclick="setEstFilter('dead',this)">Dead / Lost</button>
    <span class="ml count" id="est-count"></span>
  </div>
  <div id="est-buckets"></div>
</div>

<!-- CUSTOMERS -->
<div class="page" id="page-customers">
  <div class="cust-layout">
    <div class="cust-list">
      <div class="cust-search-wrap">
        <input class="search" style="width:100%" placeholder="Search customers..." oninput="filterCustomers(this.value)"/>
      </div>
      <div class="cust-items" id="cust-items"></div>
    </div>
    <div class="cust-detail" id="cust-detail">
      <div class="no-selection">← Select a customer to view details</div>
    </div>
  </div>
</div>

<!-- REPORTS -->
<div class="page" id="page-reports">
  <div class="report-grid" id="report-grid"></div>
</div>

<!-- MODAL -->
<div class="overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-top">
      <div><div class="modal-num" id="m-num"></div><div class="modal-co" id="m-co"></div></div>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="m2">
        <div class="mf"><label>Description</label><div class="v" id="m-desc"></div></div>
        <div class="mf"><label>Amount</label><div class="v" id="m-amt"></div></div>
      </div>
      <div class="m2">
        <div class="mf"><label>Status</label><div class="v" id="m-status"></div></div>
        <div class="mf"><label>Rep</label><div class="v" id="m-rep"></div></div>
      </div>
      <div class="m2">
        <div class="mf"><label>Due Date</label><div class="v" id="m-due"></div></div>
        <div class="mf"><label>Created</label><div class="v" id="m-created"></div></div>
      </div>
      <hr class="mdiv">
      <div class="m2">
        <div class="mf"><label>Contact</label><div class="v" id="m-contact"></div></div>
        <div class="mf"><label>Email</label><div class="v" id="m-email"></div></div>
      </div>
      <div class="m2">
        <div class="mf"><label>Production</label><div class="v" id="m-type"></div></div>
        <div class="mf"><label>Phone</label><div class="v" id="m-phone"></div></div>
      </div>
    </div>
    <div class="modal-acts">
      <button class="abtn" onclick="copyNum()">📋 Copy #</button>
      <button class="abtn" onclick="findInstaller()">🔧 Find Installer</button>
      <button class="abtn primary" onclick="findVendor()">🏭 Find Vendor</button>
    </div>
  </div>
</div>

<script>
const PROXY = '/api/corebridge';
let allOrders = [], allEstimates = [], allCompleted = [];
let activeQueue = 'all', searchQ = '', activeRep = 'all';
let activeOrderTab = 'active', orderSearch = '', estSearch = '', estFilter = 'all';
let selectedCustomer = null;
let currentItem = null;
const today = new Date(); today.setHours(0,0,0,0);

// ── QUEUE DEFS ──
const QUEUES = [
  {id:'all',       name:'All Active',      color:'var(--orange)', f: j=>true},
  {id:'sales',     name:'Sales Review',    color:'var(--pink)',   f: j=>j.cbS.includes('sales review')||j.cbS.includes('order review')||(j.cbS.includes('estimate')&&!j.cbS.includes('awaiting')&&!j.cbS.includes('approved')&&!j.cbS.includes('revision')&&!j.cbS.includes('cancelled')&&!j.cbS.includes('design'))},
  {id:'customer',  name:'Customer Action', color:'var(--yellow)', f: j=>j.cbS.includes('awaiting customer')||j.cbS.includes('customer action')||j.cbS.includes('awaiting proof')||j.cbS.includes('proof approved')},
  {id:'design',    name:'In Design',       color:'var(--teal)',   f: j=>(j.cbS.includes('in design')&&!j.cbS.includes('revision'))||j.cbS.includes('design review')||j.cbS.includes('quality control')},
  {id:'revision',  name:'Design Revision', color:'var(--orange)', f: j=>j.cbS.includes('revision')},
  {id:'production',name:'In Production',   color:'var(--blue)',   f: j=>j.cbS==='wip'||(j.cbS.includes('in production'))},
  {id:'vended',    name:'Vended',          color:'var(--purple)', f: j=>j.isVended},
  {id:'built',     name:'Built / Ready',   color:'var(--green)',  f: j=>j.cbS.includes('built')||j.cbS.includes('awaiting installation')||j.cbS.includes('awaiting pickup')},
  {id:'overdue',   name:'Overdue',         color:'var(--red)',    f: j=>j.isOverdue},
];

// ── HELPERS ──
function parseDate(raw){
  if(!raw) return null;
  if(typeof raw==='object'&&raw.DateText) raw=raw.DateText;
  if(!raw) return null;
  const d=new Date(raw); return isNaN(d.getTime())?null:d;
}
function fmtDate(d){if(!d) return '—'; return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtAmt(n){if(!n||n===0) return ''; return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtAmtOrDash(n){return fmtAmt(n)||'—';}
function initials(name){return (name||'?').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase();}
function daysSince(d){if(!d) return 999; return Math.floor((today-d)/86400000);}
function daysUntil(d){if(!d) return null; return Math.floor((d-today)/86400000);}
function dueLbl(d,isBuilt){
  if(!d) return {txt:'No date',cls:''};
  const diff=daysUntil(d);
  if(diff<0&&!isBuilt) return {txt:`${Math.abs(diff)}d overdue`,cls:'overdue'};
  if(diff===0) return {txt:'Due today',cls:'soon'};
  if(diff<=3) return {txt:`Due in ${diff}d`,cls:'soon'};
  return {txt:fmtDate(d),cls:''};
}

// ── MAP RECORD ──
function mapRecord(item, type){
  const statusRaw = item.Status||'';
  const cbS = statusRaw.toLowerCase().trim();
  const dueDate = parseDate(item.EstimateProjectedOrderDueDate)||parseDate(item.OrderDueDate)||parseDate(item.DueDate);
  const createdDate = parseDate(item.DateCreated)||parseDate(item.DateConverted)||null;
  const isBuilt = cbS.includes('built');
  const isOverdue = dueDate&&dueDate<today&&!isBuilt;
  const isVended = cbS.includes('vend')||(item.IsVended===true);
  const ageDays = createdDate ? daysSince(createdDate) : null;

  return {
    id: String(item.OrderId||item.Id||''),
    num: type==='estimate'&&item.EstimateNumber ? `EST-${item.EstimateNumber}` : String(item.OrderId||''),
    customer: item.CompanyName||item.CustomerName||item.OrderContact||'—',
    customerId: String(item.CustomerId||''),
    contact: item.OrderContact||'',
    email: item.OrderContactEmail||'',
    phone: item.CompanyPhone||'',
    description: item.OrderDescription||item.OrderText||'—',
    status: statusRaw,
    cbS,
    rep: item.OrderSalesPerson||item.SalespersonName||'—',
    dueDate,
    createdDate,
    ageDays,
    amount: parseFloat(item.OrderSubTotal||item.OrderTotal||item.SubtotalAmount||0),
    isVended, isBuilt, isOverdue,
    type,
    isDead: ageDays!==null && ageDays>60,
  };
}

// ── FETCH ──
async function apiFetch(endpoint, action, extra){
  let url=`${PROXY}?endpoint=${endpoint}`;
  if(action) url+=`&action=${action}`;
  if(extra) url+=`&${extra}`;
  const r=await fetch(url);
  if(!r.ok) throw new Error(`${endpoint}${action?'/'+action:''}: HTTP ${r.status}`);
  const d=await r.json();
  if(d&&d.error) throw new Error(d.error);
  return Array.isArray(d)?d:[];
}

// ── LOAD ALL ──
async function loadAll(){
  const btn=document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  showLoader('Connecting to Corebridge...');
  allOrders=[];allEstimates=[];allCompleted=[];

  try {
    // Active orders
    for(const s of ['WIP','BUILT']){
      try{
        const items=await apiFetch('ExOrder','GetOrdersByStatus',`listOfStatus=${s}`);
        console.log(`${s}:`,items.length);
        allOrders=allOrders.concat(items.map(i=>mapRecord(i,'order')));
      }catch(e){console.warn(s,e.message);}
    }

    // Estimates — all of them
    try{
      const items=await apiFetch('ExOrder','GetOrdersByStatus','listOfStatus=ESTIMATE');
      console.log('ESTIMATE:',items.length);
      allEstimates=items.map(i=>mapRecord(i,'estimate'));
    }catch(e){console.warn('ESTIMATE',e.message);}

    // Completed orders
    try{
      const items=await apiFetch('ExOrder','GetOrdersByStatus','listOfStatus=CLOSED');
      console.log('CLOSED:',items.length);
      allCompleted=items.map(i=>mapRecord(i,'order'));
    }catch(e){console.warn('CLOSED',e.message);}

    // Dedupe active orders
    const seen=new Set();
    allOrders=allOrders.filter(j=>{if(seen.has(j.id))return false;seen.add(j.id);return true;});

    console.log('Orders:',allOrders.length,'| Estimates:',allEstimates.length,'| Completed:',allCompleted.length);

    renderAll();
    buildRepFilters();
    buildCustomerList();

    const now=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('sync-dot').className='sync-dot live';
    document.getElementById('sync-txt').textContent=`Live · ${now}`;
  }catch(err){
    console.error(err);
    document.getElementById('sync-txt').textContent='Error: '+err.message;
  }finally{
    hideLoader();
    btn.classList.remove('spinning');
  }
}

// ── CUSTOMERS ──
function buildCustomerList(){
  // Build customer index from all records
  const custMap={};
  [...allOrders,...allEstimates,...allCompleted].forEach(j=>{
    const key=j.customer;
    if(!custMap[key]) custMap[key]={
      name:j.customer, phone:j.phone, email:j.email, contact:j.contact,
      orders:[], estimates:[], completed:[], totalRevenue:0
    };
    if(j.type==='order'&&!j.isBuilt&&allCompleted.find(c=>c.id===j.id)===undefined) custMap[key].orders.push(j);
    else if(j.type==='estimate') custMap[key].estimates.push(j);
    else custMap[key].completed.push(j);
    if(j.type==='order') custMap[key].totalRevenue+=j.amount;
  });

  window._custMap=custMap;
  renderCustomerList(Object.values(custMap).sort((a,b)=>a.name.localeCompare(b.name)));
}

function renderCustomerList(custs){
  document.getElementById('cust-items').innerHTML=custs.length===0

}
function closeModal(){document.getElementById('modal').classList.remove('open');currentItem=null;}
function copyNum(){if(currentItem)navigator.clipboard.writeText(currentItem.num).then(()=>alert('Copied: '+currentItem.num));}
function findInstaller(){window.open('https://www.google.com/search?q=sign+installer+near+Eatontown+NJ','_blank');}
function findVendor(){if(currentItem)window.open(`https://www.google.com/search?q=${encodeURIComponent(currentItem.description+' sign wholesale vendor')},'_blank`);}

// ── FILTERS ──
function setQueue(id){activeQueue=id;renderQTabs();renderQGrid();}
function setSearch(q){searchQ=q;renderQGrid();}
function setOrderTab(tab,btn){
  activeOrderTab=tab;
  document.querySelectorAll('.stab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderOrdersTable();
}
function filterOrders(q){orderSearch=q;renderOrdersTable();}
function filterEstimates(q){estSearch=q;renderEstimates();}
function setEstFilter(f,btn){
  estFilter=f;
  document.querySelectorAll('#page-estimates .pill').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderEstimates();
}
function buildRepFilters(){
  const reps=[...new Set(allOrders.map(j=>j.rep).filter(Boolean))].sort();
  if(reps.length<2) return;
  document.getElementById('rep-btns').innerHTML=
    `<button class="pill on" onclick="setRep('all',this)">All</button>`+
    reps.map(r=>`<button class="pill" onclick="setRep('${r}',this)">${r.split(' ')[0]}</button>`).join('');
}
function setRep(rep,btn){
  activeRep=rep;
  document.querySelectorAll('#rep-btns .pill').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderQGrid();
}

// ── PAGE NAV ──
function showPage(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  btn.classList.add('active');
}

// ── LOADER ──
function showLoader(t){document.getElementById('loader').classList.add('open');document.getElementById('load-txt').textContent=t;}
function hideLoader(){document.getElementById('loader').classList.remove('open');}

window.addEventListener('DOMContentLoaded', loadAll);
</script>
</body>
